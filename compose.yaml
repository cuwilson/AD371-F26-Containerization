services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: containerized-web-app:local
    env_file:
      - .env
    expose:
      - "3000"
    restart: unless-stopped
    init: true
    cpus: 0.50
    mem_limit: 128m
    mem_reservation: 64m
    pids_limit: 100
    read_only: true
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD", "node", "/app/healthcheck.js"]
      interval: 30s
      timeout: 3s
      start_period: 10s
      retries: 3
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  proxy:
    image: nginxinc/nginx-unprivileged:stable-alpine
    depends_on:
      web:
        condition: service_healthy
    ports:
      - "127.0.0.1:${PUBLIC_PORT:-8080}:8080"
    volumes:
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
    restart: unless-stopped
    cpus: 0.25
    mem_limit: 64m
    pids_limit: 100
    cap_drop:
      - ALL
    security_opt:
      - no-new-privileges:true
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8080/healthz || exit 1"]
      interval: 30s
      timeout: 3s
      start_period: 15s
      retries: 3
    networks:
      - backend
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

networks:
  backend:
    driver: bridge
